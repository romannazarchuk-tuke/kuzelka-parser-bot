name: Driving School Monitor

on:
  schedule:
    # '*/15' — каждые 15 минут
    # '5-20' — это часы работы (с 5:00 до 20:59 по UTC, что равно 7:00–22:59 в Словакии)
    - cron: '*/15 5-20 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 🟢 ИСПРАВЛЕНО: обновили до версии v4

      - name: Set up Python
        uses: actions/setup-python@v5 # 🟢 ИСПРАВЛЕНО: обновили до версии v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 tzdata

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          KUZELKA_PASSWORD: ${{ secrets.KUZELKA_PASSWORD }}
        run: python t_bot.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update DB [skip ci]"
          
          # 🟢 ИСПРАВЛЕНО: Скачиваем последние обновления перед тем, как залить свои
          git pull --rebase origin main
          
          git push
