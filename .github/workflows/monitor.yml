name: Driving School Monitor

on:
  schedule:
    - cron: '*/20 * * * *' # Запуск каждые 20 минут
  workflow_dispatch: # Кнопка ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 🟢 ИСПРАВЛЕНО: обновили до версии v4

      - name: Set up Python
        uses: actions/setup-python@v5 # 🟢 ИСПРАВЛЕНО: обновили до версии v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 tzdata

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          KUZELKA_PASSWORD: ${{ secrets.KUZELKA_PASSWORD }}
        run: python t_bot.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          # 🟢 ИСПРАВЛЕНО: добавляем файлы только если они есть, чтобы не было ошибки "Exit code 2"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update DB [skip ci]"
          git push
